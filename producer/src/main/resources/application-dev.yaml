spring:
  application:
    name: spring-boot-kafka

  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

server:
  port: 8086

rabbitmq:
  exchange:
    test: test_exchange
  routing-key:
    test: test_routing_key

logging:
  level:
    root: info
    com.sts: debug
    org.springframework.web: debug
    org.springframework.amqp: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} [%file:%line] - %msg%n"